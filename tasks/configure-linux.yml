- name: Apply the netdata.conf.j2 template
  ansible.builtin.template:
    src: "{{ netdata_custom_config_path }}"
    dest: "{{ netdata_config_dir }}/netdata.conf"
    owner: root
    group: root
    mode: '0644'
  when: netdata_manage_config
  notify: Restart Netdata

- name: Configure Go Collector Plugins
  ansible.builtin.template:
    src: go.d/plugin.conf.j2
    dest: "{{ netdata_config_dir }}/go.d/{{ item.name }}.conf"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ netdata_go_collector_plugins }}"
  loop_control:
    label: "{{ item.name | default(omit) }}"
  when:
    - netdata_go_collector_plugins is defined and netdata_go_collector_plugins|length > 0
  notify: Restart Netdata

- name: Lay down charts.d.conf
  ansible.builtin.copy:
    content: 'enable_all_charts="yes"'
    dest: "/etc/netdata/charts.d.conf"
    owner: root
    group: root
    mode: '0644'
  when: netdata_manage_charts

- name: Process all Jinja2 templates in a directory
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "{{ netdata_chart_dir }}/{{ item | basename | regex_replace('\\.j2$', '') }}"
    owner: root
    group: root
    mode: '0744'
  loop: "{{ lookup('fileglob', netdata_custom_charts_path + '/*.j2', wantlist=True) }}"
  when:
    - netdata_manage_charts and netdata_custom_charts_path != ""
  notify: Restart Netdata
