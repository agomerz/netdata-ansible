---

- name: Add repo and install package
  block:

# Debian
    - name: Install Netdata repo key.
      ansible.builtin.apt_key:
        url: "{{ netdata_repository_key_url }}"
        state: present

    - name: Add repository for Debian
      ansible.builtin.apt_repository:
        filename: "netdata"
        repo: "deb [by-hash=yes] {{ netdata_repository_url }}{{ netdata_release_version }}/{{ ansible_distribution | lower }} {{ ansible_distribution_release }}/"
        state: present
        update_cache: true

    - name: Install package on Debian
      ansible.builtin.apt:
        name: "netdata"
        state: present
      notify: Restart Netdata

    - name: Install chart support on Debian if enabled
      ansible.builtin.apt:
        name: "netdata-plugin-chartsd"
        state: present
      notify: Restart Netdata
      when: netdata_charts_enabled
