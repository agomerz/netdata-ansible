---

- name: Add repo and install package
  block:

# Debian

    - name: Ensure gpg is installed.
      ansible.builtin.apt:
        name: gnupg
        state: present
        update_cache: true

    - name: Install Netdata repo key.
      ansible.builtin.apt_key:
        url: "{{ netdata_repository_key_url }}"
        state: present

    - name: Add repository for Debian
      ansible.builtin.apt_repository:
        filename: "netdata"
        repo: |
          deb {{ netdata_repository_url }}{{ netdata_release_version }}/{{ ansible_facts.os_family | lower }}/ {{ ansible_distribution_release | lower }}/
        state: present

    - name: Install package on Debian
      ansible.builtin.apt:
        name: "netdata"
        state: present
        update_cache: true
      notify: Restart Netdata

    - name: Install chart support on Debian if enabled
      ansible.builtin.apt:
        name: "netdata-plugin-chartsd"
        state: present
      notify: Restart Netdata
      when: netdata_manage_charts
